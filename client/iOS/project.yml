# XcodeGen spec for the iOS client. scripts/build-ios.sh generates
# Binary.xcodeproj from it (the project itself isn't checked in).
#
# The app compiles the macOS client's models, networking, stores and
# conversation views straight from ../Sources/Binary (they build for both
# platforms); Sources/ here holds what is iOS-only: navigation, the session
# list, settings and the project / folder pickers.
name: Binary
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Binary:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ../Resources/zh-Hans.json
        group: Resources
        buildPhase: resources
      - path: ../Sources/Binary/Models
        group: Shared
      - path: ../Sources/Binary/Network
        group: Shared
      - path: ../Sources/Binary/Stores
        group: Shared
      - path: ../Sources/Binary/App/DebugHooks.swift
        group: Shared
      # Views that build for both platforms (the rest are macOS-only).
      - path: ../Sources/Binary/Views/Components.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/ComposerView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/EffortControl.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/FilePreview.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/FlowText.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/Format.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/ImageAttachments.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/MarkdownView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/NewSessionView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/PermissionCard.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/Platform.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/SessionDetailView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/SearchHighlight.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/SessionInspector.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/SlashCommands.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/Theme.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/ToolCallView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/TranscriptView.swift
        group: Shared/Views
      - path: ../Sources/Binary/Views/UsageViews.swift
        group: Shared/Views
    settings:
      base:
        PRODUCT_NAME: Binary
        # Override with BINARY_IOS_BUNDLE_ID when building (scripts/build-ios.sh):
        # a bundle ID belongs to one Apple developer team.
        PRODUCT_BUNDLE_IDENTIFIER: dev.binary.ios
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
