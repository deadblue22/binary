name: Server tests
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
